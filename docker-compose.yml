version: '3.8'

services:
  # 1. Database: PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: metropolis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: metropolis_civic
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metropolis_civic"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend: Python FastAPI + LangGraph Agents
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: metropolis-fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/metropolis_civic
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  # 3. Frontend: React / Next.js
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: metropolis-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
